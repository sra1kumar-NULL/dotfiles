# ── Theme ────────────────────────────────────────────────────────────────────
# theme.conf (colours + tab bar) is generated by ~/.config/mango/scripts/theme-set.sh
# from the active theme's colors.sh, so kitty follows the same palette as the
# bar, borders, launcher and notifications. theme-set reloads running kittys
# with SIGUSR1. Previous versions: kitty.conf.pre-theme, kitty.conf.pre-rice.
include theme.conf

# ── Font ─────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        11.0
modify_font      cell_height 112%
disable_ligatures never

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_trail           1
cursor_trail_decay     0.1 0.4
cursor_blink_interval  0.5

# ── Window ───────────────────────────────────────────────────────────────────
# Matches mango's 4px gaps and 0 radius, so terminals sit flush in the tiling.
window_padding_width   10
window_margin_width    0
single_window_padding_width 10
confirm_os_window_close 0
hide_window_decorations yes
placement_strategy     center

# ── Transparency: blur is drawn by the compositor (mango blur=1/blur_layer=1) ─
background_opacity     0.85
background_blur        20
dynamic_background_opacity yes

# ── Tabs ─────────────────────────────────────────────────────────────────────
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2
tab_title_template        "{index}  {title}"
active_tab_title_template "{index}  {title}"

# ── Scrollback & performance ────────────────────────────────────────────────
scrollback_lines       20000
scrollback_pager_history_size 64
repaint_delay          8
input_delay            2
sync_to_monitor        yes
wayland_titlebar_color background

# ── Bell ─────────────────────────────────────────────────────────────────────
enable_audio_bell      no
visual_bell_duration   0.05

# ── Shell ────────────────────────────────────────────────────────────────────
shell /bin/bash
shell_integration enabled

# ── Keys ─────────────────────────────────────────────────────────────────────
map ctrl+c    copy_or_interrupt
map ctrl+shift+v paste_from_clipboard

# Splits and tabs
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Search kitten (kept from the previous config)
map ctrl+f        launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & zoom
map page_up    scroll_page_up
map page_down  scroll_page_down
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Open the URL/path under the cursor, and unicode input
map ctrl+shift+e open_url_with_hints
map ctrl+shift+u kitten unicode_input
