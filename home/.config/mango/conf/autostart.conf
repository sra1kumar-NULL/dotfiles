# Light stack for mango — DMS is NOT started here (it stays the shell for the
# Hyprland session). Each line replaces one thing DMS used to provide.
# Absolute paths: mango does not expand ~ or $HOME in exec_once (verified).

exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY MANGO_INSTANCE_SIGNATURE
exec_once=gnome-keyring-daemon --start --components=secrets

# Polkit agent — DMS ran one in-process; nothing else on the system does.
exec_once=/usr/libexec/lxqt-policykit-agent

# Notifications, clipboard history, bar (bar.sh starts one per monitor)
exec_once=/usr/bin/mako
exec_once=sh -c '/usr/bin/wl-paste --watch /usr/bin/cliphist store'
exec_once=/home/sasuke/.config/mango/scripts/bar.sh

# Volume/brightness OSD: wob reads percentages off a fifo
exec_once=sh -c 'f="$XDG_RUNTIME_DIR/wob.fifo"; rm -f "$f"; mkfifo -m 600 "$f"; tail -f "$f" | /usr/bin/wob'

# Wallpaper + palette (restores the last wallpaper and regenerates the theme)
exec_once=/home/sasuke/.config/mango/scripts/wallpaper.sh restore

# Idle: lock at 10min, screens off at 15min, lock before suspend
exec_once=/home/sasuke/.config/mango/scripts/idle.sh
