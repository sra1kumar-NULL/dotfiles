# Omarchy-style keybinds, light stack (fuzzel/mako/mangobar/scripts).
# Chords stay identical to conf/binds.lua; only the actions behind them changed.
# Press SUPER + K for the on-screen cheat sheet.
#
# Chords are identical to the Hyprland config wherever mango has an equivalent.
# Differences are marked with "[mango]".

# ── Apps ─────────────────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,$term
bind=SUPER+SHIFT,b,spawn,$browser
bind=SUPER+SHIFT+ALT,b,spawn,$browser --incognito
bind=SUPER+SHIFT,f,spawn,$filemanager
bind=SUPER,e,spawn,$filemanager
bind=SUPER+SHIFT,c,spawn,$editor
bind=SUPER+SHIFT,n,spawn,$term -e nvim
bind=SUPER+SHIFT,t,spawn,/home/sasuke/.config/mango/scripts/tui.sh btop
# TUIs float centred via the tui-float window rule (scripts/tui.sh)
bind=SUPER+SHIFT,g,spawn,/home/sasuke/.config/mango/scripts/tui.sh lazygit
bind=SUPER+SHIFT,m,spawn,spotify

# ── Shell (fuzzel + mako + scripts, replacing the DMS modules) ──────────────
bind=SUPER,space,spawn,fuzzel
bind=SUPER,Escape,spawn,/home/sasuke/.config/mango/scripts/powermenu.sh
# [mango] cheat sheet reads the mango config instead of the Hyprland one
bind=SUPER,k,spawn,/home/sasuke/.config/mango/scripts/cheatsheet.sh
bind=SUPER,v,spawn,/home/sasuke/.config/mango/scripts/clipboard.sh
bind=SUPER+CTRL,v,spawn,/home/sasuke/.config/mango/scripts/clipboard.sh
bind=SUPER,n,spawn,makoctl restore
bind=SUPER,comma,spawn,makoctl dismiss
bind=SUPER+SHIFT,comma,spawn,makoctl dismiss --all
bind=SUPER+CTRL,comma,spawn,makoctl mode -t do-not-disturb
# [mango] mango has a native overview dispatcher
# (DMS is not running in this session, so nothing external tracks it)
bind=SUPER,a,toggleoverview
bind=SUPER+SHIFT,a,togglejump
bind=SUPER+SHIFT,space,spawn,sh -c 'pkill -x mangobar || setsid /home/sasuke/.local/bin/mangobar'
bind=SUPER,i,spawn,pavucontrol
bind=SUPER+CTRL,r,spawn_shell,pkill -x mangobar; pkill -x mako; setsid /home/sasuke/.local/bin/mangobar & setsid /usr/bin/mako &

# ── System controls ──────────────────────────────────────────────────────────
bind=SUPER+CTRL,n,spawn,/home/sasuke/.config/mango/scripts/night.sh
bind=SUPER+CTRL,i,spawn,/home/sasuke/.config/mango/scripts/inhibit.sh
# Omarchy 3.x panels as floating TUIs. The GUI tools stay one step away:
# pavucontrol on SUPER+I, blueman/nm-connection-editor as "Manager"/"Advanced"
# in the bluetooth/network menus. Wi-Fi has no TUI (impala needs iwd, this box
# runs NetworkManager), so SUPER+CTRL+W opens the network menu instead.
bind=SUPER+CTRL,a,spawn,/home/sasuke/.config/mango/scripts/tui.sh wiremix
bind=SUPER+CTRL,b,spawn,/home/sasuke/.config/mango/scripts/tui.sh bluetui
bind=SUPER+CTRL,w,spawn,/home/sasuke/.config/mango/scripts/menu.sh network
bind=SUPER+CTRL,t,spawn,/home/sasuke/.config/mango/scripts/tui.sh btop
bind=SUPER+CTRL,p,spawn,sh -c 'p=$(powerprofilesctl get); case $p in power-saver) n=balanced;; balanced) n=performance;; *) n=power-saver;; esac; powerprofilesctl set $n; notify-send "Power profile" "$n"'
bind=SUPER+CTRL,space,spawn,/home/sasuke/.config/mango/scripts/wallpaper.sh next
# Thumbnail picker: fuzzel renders the actual wallpapers via Rofi's extended
# dmenu icon protocol, and the choice applies immediately.
bind=SUPER+ALT,w,spawn,/home/sasuke/.config/mango/scripts/wallpaper-pick.sh
# Theme picker on omarchy's chord. Light/dark moved to SUPER+ALT+SPACE -> Style.
# Falls back to the Style menu until theme-pick.sh exists.
bind=SUPER+CTRL+SHIFT,space,spawn_shell,if [ -x /home/sasuke/.config/mango/scripts/theme-pick.sh ]; then /home/sasuke/.config/mango/scripts/theme-pick.sh; else /home/sasuke/.config/mango/scripts/menu.sh style; fi
bindl=SUPER,l,spawn,/home/sasuke/.config/mango/scripts/lock.sh
bindl=SUPER+CTRL,l,spawn,/home/sasuke/.config/mango/scripts/lock.sh
bind=SUPER+SHIFT,l,spawn,systemctl suspend

# ── Hardware keys: wpctl/brightnessctl with a wob OSD overlay ───────────────
bindl=NONE,XF86AudioRaiseVolume,spawn,/home/sasuke/.config/mango/scripts/osd.sh volume up
bindl=NONE,XF86AudioLowerVolume,spawn,/home/sasuke/.config/mango/scripts/osd.sh volume down
bindl=NONE,XF86AudioMute,spawn,/home/sasuke/.config/mango/scripts/osd.sh volume mute
bindl=NONE,XF86AudioMicMute,spawn,/home/sasuke/.config/mango/scripts/osd.sh volume mic
bindl=NONE,XF86MonBrightnessUp,spawn,/home/sasuke/.config/mango/scripts/osd.sh brightness up
bindl=NONE,XF86MonBrightnessDown,spawn,/home/sasuke/.config/mango/scripts/osd.sh brightness down
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
# XF86AudioPause is the same keycode as XF86AudioPlay on this keyboard — one bind covers both
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=SUPER+SHIFT,p,spawn,playerctl play-pause

# ── Capture ──────────────────────────────────────────────────────────────────
# [mango] grim/slurp/wf-recorder. Screenshots land in ~/Pictures/Screenshots AND
# the clipboard; the notification has an Edit action once satty is installed.
bind=NONE,Print,spawn,/home/sasuke/.config/mango/scripts/screenshot.sh region
bind=SUPER+SHIFT,s,spawn,/home/sasuke/.config/mango/scripts/screenshot.sh region
bind=SHIFT,Print,spawn,/home/sasuke/.config/mango/scripts/screenshot.sh window
bind=CTRL,Print,spawn,/home/sasuke/.config/mango/scripts/screenshot.sh output
# Recording with desktop audio to ~/Videos/Recordings; the same chord stops it.
bind=ALT,Print,spawn,/home/sasuke/.config/mango/scripts/record.sh region
bind=CTRL+ALT,Print,spawn,/home/sasuke/.config/mango/scripts/record.sh output
bind=SUPER,Print,spawn,/home/sasuke/.config/mango/scripts/colorpick.sh

# ── Windows ──────────────────────────────────────────────────────────────────
bind=SUPER,w,killclient
bind=SUPER,q,killclient
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+ALT,f,togglemaximizescreen
bind=SUPER,o,toggleglobal
# [mango] no pseudo-tile; fake fullscreen is the nearest equivalent
bind=SUPER,p,togglefakefullscreen
bind=SUPER,j,dwindle_toggle_split_direction
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05
# [mango] groups are a bar you join by direction rather than a toggle
bind=SUPER,g,togglegroupbar
bind=SUPER+ALT,Tab,groupfocus,next
bind=SUPER+ALT,Left,groupjoin,left
bind=SUPER+ALT,Right,groupjoin,right
bind=SUPER+ALT,g,groupleave

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ── Tags (the Hyprland config's workspaces 1-9) ─────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT+ALT,1,tag,1
bind=SUPER+SHIFT+ALT,2,tag,2
bind=SUPER+SHIFT+ALT,3,tag,3
bind=SUPER+SHIFT+ALT,4,tag,4
bind=SUPER+SHIFT+ALT,5,tag,5
bind=SUPER+SHIFT+ALT,6,tag,6
bind=SUPER+SHIFT+ALT,7,tag,7
bind=SUPER+SHIFT+ALT,8,tag,8
bind=SUPER+SHIFT+ALT,9,tag,9

bind=SUPER,Tab,viewtoright
bind=SUPER+SHIFT,Tab,viewtoleft
bind=SUPER+CTRL,Tab,view,-1
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER+SHIFT,Page_Down,tagtoright
bind=SUPER+SHIFT,Page_Up,tagtoleft
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# 3-finger horizontal swipe = tag switch, like the Hyprland gesture
gesturebind=NONE,left,3,viewtoright
gesturebind=NONE,right,3,viewtoleft
gesturebind=NONE,up,3,toggleoverview
gesturebind=NONE,down,3,toggleoverview

# ── Scratchpad ───────────────────────────────────────────────────────────────
bind=SUPER,s,toggle_scratchpad
bind=SUPER+ALT,s,minimized

# ── Monitors ─────────────────────────────────────────────────────────────────
bind=SUPER+CTRL+SHIFT,Left,focusmon,left
bind=SUPER+CTRL+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT+ALT,Left,tagmon,left
bind=SUPER+SHIFT+ALT,Right,tagmon,right

# ── Compositor ───────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,r,reload_config
# Restart the bars: picks up a monitor hotplug or a mangobar rebuild
# (reload_config only re-reads the compositor's own config).
bind=SUPER+CTRL+SHIFT,r,spawn,/home/sasuke/.config/mango/scripts/bar.sh restart
# Cycle only the layouts in use (dwindle is the default from look.conf's
# tag_rule, so it stays in the ring or the cycle could never return to it).
circle_layout=dwindle,tile,scroller,monocle,grid
bind=SUPER+ALT,l,switch_layout
bind=SUPER+SHIFT+ALT,q,quit

# ── Menus ────────────────────────────────────────────────────────────────────
# Route-driven menus (~/.config/mango/menus/*.json, served by menu.sh), modelled
# on omarchy-menu. The chords match omarchy's where it has an equivalent, so the
# muscle memory carries between the Hyprland and mango sessions.
#
# The bar's module buttons open these same routes, so pointer and keyboard reach
# identical UI. `menu.sh --list` prints every route for the cheat sheet.
#
# Night light is NOT here: it already exists as SUPER+CTRL+N, matching omarchy.
# The audio mixer gave up SUPER+ALT+SPACE for the root menu and lost nothing --
# it was bound three times over, and still answers to SUPER+I and SUPER+CTRL+A
# as well as SUPER+CTRL+H -> Audio -> Mixer.
bind=SUPER+ALT,space,spawn,/home/sasuke/.config/mango/scripts/menu.sh
bind=SUPER+CTRL,h,spawn,/home/sasuke/.config/mango/scripts/menu.sh hardware
bind=SUPER+CTRL,o,spawn,/home/sasuke/.config/mango/scripts/menu.sh toggle
bind=SUPER+CTRL,c,spawn,/home/sasuke/.config/mango/scripts/menu.sh capture
bind=SUPER+CTRL+SHIFT,n,spawn,/home/sasuke/.config/mango/scripts/menu.sh network
bind=SUPER+CTRL+SHIFT,b,spawn,/home/sasuke/.config/mango/scripts/menu.sh bluetooth
