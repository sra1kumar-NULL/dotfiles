# Mirror of ~/.config/hypr/conf/env.lua
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango

# Qt/GTK follow DMS's matugen theme through the gtk3 platform theme
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1

env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24

# Hybrid Intel + GTX 1650: Intel iHD handles VA-API encode/decode, so NVIDIA
# VA-API and GLX vendor overrides stay off. NVD_BACKEND only applies when an
# app opts into the nvidia VA driver explicitly.
env=NVD_BACKEND,direct

# mango does not expand $HOME in env= values (verified: children receive the
# literal string), so this is spelled out. A literal $HOME here would break
# Flatpak .desktop discovery in the DMS launcher.
env=XDG_DATA_DIRS,/home/sasuke/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
