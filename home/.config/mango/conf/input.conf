# Mirror of ~/.config/hypr/conf/input.lua
# Keyboard
repeat_delay=250
repeat_rate=35
numlock_on=1
xkb_rules_layout=us

# follow_mouse=1
sloppy_focus=1
warp_cursor=0

# Trackpad (applied on `mmsg dispatch reload_config`, no relogin needed)
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_factor=0.7
trackpad_accel_profile=2

# Mouse
mouse_accel_profile=2
mouse_accel_speed=0.0

# Gestures: workspace_swipe_distance=700, cancel_ratio=0.2 in the Hyprland config
gesture_live=1
gesture_swipe_distance=700
gesture_swipe_cancel_ratio=0.2
