# Mirror of ~/.config/hypr/conf/look.lua
# Border colours here are fallbacks; dms/colors.conf overrides them from the wallpaper.

# ── Dimensions (gaps_in 4 / gaps_out 8 / border_size 2 / rounding 8) ─────────
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=4
gap_outer_vertical=4
border_px=2
border_radius=0
no_radius_when_single=0
smart_gaps=0

# ── Fallback colours (0xRRGGBBAA) ───────────────────────────────────────────
root_color=0x1e1e2eff
border_color=0x31324488
focus_color=0x89b4faee
urgent_color=0xad401fff
drop_color=0x89b4fa55
split_color=0x89b4faff

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# ── Blur (Hyprland: size 4, passes 2) ───────────────────────────────────────
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=4
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# ── Shadows (Hyprland: range 6, color 0x66000000 → RRGGBBAA) ────────────────
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=6
shadows_blur=10
shadows_position_x=0
shadows_position_y=0
shadows_color=0x00000066

focused_opacity=1.0
unfocused_opacity=1.0

# ── Animations: durations are the Hyprland speeds (deciseconds → ms) ────────
# windowsIn 3.5 → 350, windowsOut 1.5 → 150, windows 4 → 400, workspaces 2 → 200
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.9
zoom_end_ratio=1.0
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_open=350
animation_duration_close=150
animation_duration_move=400
animation_duration_tag=200
animation_duration_focus=0
# easeOutQuint = (0.23, 1), (0.32, 1)
animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.23,1,0.32,1
# close used the linear curve
animation_curve_close=0,0,1,1
animation_curve_focus=0.23,1,0.32,1
# almostLinear = (0.5, 0.5), (0.75, 1)
animation_curve_opacity_fade_in=0.5,0.5,0.75,1
animation_curve_opacity_fade_out=0.5,0.5,0.75,1

# ── Layout: dwindle everywhere, like the Hyprland config ────────────────────
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
dwindle_smart_resize=1
default_master_factor=0.55
tag_num=9

# ── Overview (SUPER+A). No hot corner, matching the Hyprland setup ──────────
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# ── Misc, from look.lua's misc{} block ──────────────────────────────────────
focus_on_activate=1
no_border_when_single=0
enable_floating_snap=1
snap_distance=30
xwayland_persistence=1
sync_obj_enable=1
auto_reload_config=1
