# Laptop panel on the left, LG UltraFine 32" 4K on the right.
# The LG only offers 3840x2160 at 30 Hz on this link (60 Hz tops out at
# 2560x1440). Running 2560x1440@60 for smoothness (user choice). eDP-1 is 1440
# logical wide at 1.333, so DP-1 starts at x=1440.
# Unmatched outputs fall back to their preferred mode automatically.
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.333333,primary:1
monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:60,x:1440,y:0,scale:1
# On HDMI-A-1 the LG does full 3840x2160@60, scaled 1.5 (user choice).
monitor_rule=name:^HDMI-A-1$,width:3840,height:2160,refresh:60,x:1440,y:0,scale:1.5
