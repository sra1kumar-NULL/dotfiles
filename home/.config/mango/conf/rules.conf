# Window and layer rules for mango.


# ── Movies: never let the screen sleep while something is fullscreen ────────
idle_inhibit_when_fullscreen=1
window_rule=app_id:^mpv$,idle_inhibit_when_focus:1

# ── Picture-in-picture (Chrome / Helium / Zen) ──────────────────────────────
window_rule=title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$,is_floating:1,is_global:1,is_overlay:1,width:0.25,height:0.25,offset_x:90,offset_y:85,no_force_center:1

# ── Small utility windows float centred (50% x 55%) ────────────────────────
window_rule=app_id:^(org.pulseaudio.pavucontrol)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(pavucontrol)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(blueman-manager)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(nm-connection-editor)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(org.gnome.Calculator)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(xdg-desktop-portal-gtk)$,is_floating:1,width:0.5,height:0.55
window_rule=app_id:^(btop-float)$,is_floating:1,width:0.5,height:0.55
# Utility terminals spawned by the menus (QR code, speed test, wlr-randr)
window_rule=app_id:^(mango-float)$,is_floating:1,width:0.5,height:0.6
# TUIs launched by scripts/tui.sh (bluetui, wiremix, lazygit, btop, fastfetch,
# package install/update). A little larger than mango-float: lazygit and the
# fzf package picker need the room.
window_rule=app_id:^(tui-float)$,is_floating:1,width:0.6,height:0.65

# ── File dialogs float centred ─────────────────────────────────────────────
window_rule=title:^(Open File|Save File|Save As|Open Folder|Select a File|Choose Files|File Upload)(.*)$,is_floating:1

# ── Screen-share indicator stays on top of every tag ───────────────────────
window_rule=title:.*is sharing (a window|your screen).*,is_global:1

# The Hyprland config also had a no_focus rule for empty-named XWayland drag
# surfaces. mango's equivalent is below; enable it if XWayland drags steal focus.
# window_rule=app_id:^$,title:^$,is_open_silent:1

# No shadow under the bar (layer_shadows=1 still applies to menus/notifications).
layer_rule=layer_name:mangobar,no_shadow:1

# Claude desktop (Electron on XWayland) grabs the keyboard, and the shortcuts
# inhibitor that creates disables EVERY mango bind while it is focused
# (could not switch tags). Ignore its inhibit requests.
window_rule=app_id:^(com.anthropic.Claude|Claude|claude)$,allow_shortcuts_inhibit:0
