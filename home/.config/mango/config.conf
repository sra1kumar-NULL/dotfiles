# Minimal mangowm + DankMaterialShell (omarchy-inspired)
# Mirrors ~/.config/hypr/ one file at a time:
#   conf/ : hand-written config, edit freely
#   dms/  : written by DMS (colors, layout, outputs, cursor, window rules) — don't edit
#
# Validate without logging in:  mango -c ~/.config/mango/config.conf -p
# Hot reload in session:        SUPER+SHIFT+R  (or: mmsg dispatch reload_config)

# ── Shared app definitions (mirror of the locals in conf/binds.lua) ───────────
var=term,kitty
var=browser,google-chrome-stable
var=filemanager,thunar
var=editor,code
var=shots,/home/sasuke/Pictures/Screenshots

source=~/.config/mango/conf/env.conf
source=~/.config/mango/conf/input.conf
source=~/.config/mango/conf/monitors.conf
source=~/.config/mango/conf/look.conf
source=~/.config/mango/conf/rules.conf
source=~/.config/mango/conf/binds.conf
source=~/.config/mango/conf/autostart.conf

# DMS-managed files load last so the shell's theme and display settings win
# (same precedence as hypr/dms/*.lua). auto_reload_config watches these too, so
# a wallpaper or Settings change re-themes a live session.
#
# Two DMS staleness issues are worked around here:
#  1. Its mango matugen template emits pre-0.18 colour keys, so it is disabled
#     (matugenTemplateMangowc=false) in favour of the user template at
#     ~/.config/matugen/templates/mango-colors.conf -> colors-user.conf.
#  2. Its layout/outputs/windowrules writers emit mangowc ~0.12 names
#     (borderpx, gappih, monitorrule=, windowrule=, appid: ...) which mango 0.18
#     rejects. They are rewritten into dms/translated/ by
#     ~/.local/bin/mango-dms-translate (mango-dms-translate.path user unit).
# Do NOT source dms/*.conf directly.
source_optional=~/.config/mango/dms/colors-user.conf
# source_optional=~/.config/mango/dms/translated/layout.conf  # DMS not run in mango; conf/ is authoritative
# source_optional=~/.config/mango/dms/translated/outputs.conf  # DMS not run in mango; conf/ is authoritative
# source_optional=~/.config/mango/dms/translated/cursor.conf  # DMS not run in mango; conf/ is authoritative
# source_optional=~/.config/mango/dms/translated/windowrules.conf  # DMS not run in mango; conf/ is authoritative
# source_optional=~/.config/mango/dms/translated/binds.conf  # DMS not run in mango; conf/ is authoritative
