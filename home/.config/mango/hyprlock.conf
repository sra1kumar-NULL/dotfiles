# Generated by ~/.config/mango/scripts/theme-set.sh from themes/wallpaper/colors.sh -- do not edit.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/sasuke/.config/mango/lockscreen
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.15
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(e4e1e9)
    font_size = 120
    font_family = Google Sans Flex Bold
    position = 0, 200
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    color = rgb(c7c5d0)
    font_size = 22
    font_family = Google Sans Flex
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgb(bec2ff)
    inner_color = rgba(131318e6)
    font_color = rgb(e4e1e9)
    font_family = Google Sans Flex
    check_color = rgb(e7b9d5)
    fail_color = rgb(ffb4ab)
    capslock_color = rgb(c5c4dd)
    fade_on_empty = false
    placeholder_text = <span foreground="#c7c5d0">Password</span>
    fail_text = <span foreground="#ffb4ab">$FAIL ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    color = rgb(bec2ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}
