# mpv for movies (omarchy-style defaults, merged with the original keep-open)
# Original: mpv.conf.pre-omarchy

# Hardware decoding where it is known to be safe (Intel iHD VA-API here);
# falls back to software silently.
hwdec=auto-safe
vo=gpu-next

# Don't close at the end of a file; resume where you left off.
keep-open=yes
save-position-on-quit=yes
